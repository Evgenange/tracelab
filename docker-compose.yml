services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tracelab
      POSTGRES_USER: tracelab
      POSTGRES_PASSWORD: tracelab
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracelab -d tracelab"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://tracelab:tracelab@postgres:5432/tracelab
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /app/storage
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://tracelab:tracelab@postgres:5432/tracelab
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - dataset_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
    command: rq worker tracelab --url redis://redis:6379/0
    environment:
      DATABASE_URL: postgresql+psycopg://tracelab:tracelab@postgres:5432/tracelab
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /app/storage
    volumes:
      - dataset_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  dataset_storage: